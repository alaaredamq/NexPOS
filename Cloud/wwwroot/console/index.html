<!doctype html>

  <meta name="theme-color" content="#050a1c" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Coduo Cloud</title>
  <!-- The theme is set before the first paint, so a light-mode user never sees a dark flash. -->
  <script>
    (function (d) {
      var t = 'dark';
      try { t = localStorage.getItem('coduo.theme') === 'light' ? 'light' : 'dark'; } catch (e) { }
      d.setAttribute('data-theme', t);
      if (t === 'light') document.querySelector('meta[name=theme-color]').setAttribute('content', '#eef2fb');
    })(document.documentElement);
  </script>
  <link rel="icon" href="/cloud-icon.svg" type="image/svg+xml" />
