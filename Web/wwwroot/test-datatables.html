<!DOCTYPE html>
<html>
<head>
    <title>DataTable Test</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>DataTable Test Page</h1>
    
    <h3>Test 1: Fetch Data Directly</h3>
    <button id="testFetch" class="btn btn-primary mb-3">Test Fetch Data</button>
    <pre id="fetchResult" class="bg-light p-3" style="max-height: 300px; overflow: auto;"></pre>
    
    <h3>Test 2: DataTable with Server-Side</h3>
    <table id="testTable" class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Barcode</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <script>
        $(document).ready(function() {
            // Test 1: Direct fetch
            $('#testFetch').on('click', function() {
                $('#fetchResult').text('Loading...');
                
                $.ajax({
                    url: '/Products/GetProducts?draw=1&start=0&length=10&searchValue=',
                    type: 'GET',
                    success: function(data) {
                        $('#fetchResult').text(JSON.stringify(data, null, 2));
                        console.log('Direct fetch success:', data);
                    },
                    error: function(xhr, status, error) {
                        $('#fetchResult').text('Error: ' + error + '\n\nStatus: ' + xhr.status + '\n\nResponse: ' + xhr.responseText);
                        console.error('Direct fetch error:', xhr, status, error);
                    }
                });
            });
            
            // Test 2: DataTable initialization
            try {
                var table = $('#testTable').DataTable({
                    processing: true,
                    serverSide: true,
                    ajax: {
                        url: '/Products/GetProducts',
                        type: 'GET',
                        data: function(d) {
                            console.log('DataTable sending:', d);
                            return {
                                draw: d.draw,
                                start: d.start,
                                length: d.length,
                                searchValue: d.search.value || '',
                                sortColumn: d.columns[d.order[0].column].data,
                                sortDirection: d.order[0].dir
                            };
                        },
                        dataSrc: function(json) {
                            console.log('DataTable received:', json);
                            return json.data || [];
                        },
                        error: function(xhr, error, code) {
                            console.error('DataTable AJAX error:', error, code, xhr);
                            alert('Error loading data: ' + error);
                        }
                    },
                    columns: [
                        { data: 'id' },
                        { data: 'name' },
                        { data: 'barcode' },
                        { data: 'categoryName' },
                        { data: 'sellingPrice' }
                    ]
                });
                
                console.log('DataTable initialized:', table);
            } catch (e) {
                console.error('Error initializing DataTable:', e);
                alert('Error: ' + e.message);
            }
        });
    </script>
</body>
</html>
